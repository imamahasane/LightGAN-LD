seed: 42
deterministic: true
model:
  generator:
    in_channels: 1
    out_channels: 1
    base_channels: 32
    num_down: 3
    use_ghost: true
    use_condconv: true
    use_eca: true
    condconv_experts: 4
    norm: batch
    mixstyle_p: 0.5
    mixstyle_alpha: 0.1
    dropout: 0.0
  discriminator:
    in_channels: 1
    base_channels: 32
    num_layers: 4
    spectral_norm: false
    norm: batch
  sinogram_encoder:
    enabled: true
    penc: 0.5
    in_channels: 1
    out_channels: 1
    base_channels: 24
    norm: batch
loss:
  adv_weight: 1.0
  l1_weight: 1.0
  perceptual_weight: 0.05
  ssim_weight: 0.2
  ffl_weight: 0.1
  edge_weight: 0.1
  perceptual:
    pretrained: false
  ffl:
    alpha: 1.0
    log_matrix: false
train:
  output_dir: outputs/default
  epochs: 200
  amp: true
  grad_clip_norm: 1.0
  log_every: 50
  save_every_epochs: 10
  optimizer:
    lr: 2.0e-4
    betas: [0.5, 0.999]
    weight_decay: 0.0
  onecycle:
    enabled: true
    pct_start: 0.1
    div_factor: 10
    final_div_factor: 100
  swa:
    enabled: true
    start_epoch: 100
  early_stop:
    enabled: true
    metric: ssim
    patience: 10
  wandb:
    enabled: false
    project: lightgan-ld
eval:
  use_encoder: false
