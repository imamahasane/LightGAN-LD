defaults:
  - base.yaml
data:
  name: dummy
  image_size: 64
  batch_size: 2
  val_batch_size: 2
  num_workers: 0
  pin_memory: false
  normalize: true
  augment: false
  splits:
    train: {path: data/dummy/train.h5}
    val: {path: data/dummy/val.h5}
    test: {path: data/dummy/test.h5}
train:
  output_dir: outputs/dummy
  epochs: 1
  log_every: 1
  save_every_epochs: 1
model:
  generator:
    base_channels: 8
    num_down: 2
    use_condconv: false
    mixstyle_p: 0.0
  discriminator:
    base_channels: 8
    num_layers: 2
  sinogram_encoder:
    base_channels: 8
    penc: 0.5
loss:
  perceptual_weight: 0.0
